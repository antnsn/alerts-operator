alertmanager_config: |
  inhibit_rules:
  - equal:
    - alertname
    source_matchers:
    - severity="critical"
    target_matchers:
    - severity="warning"
  receivers:
  - discord_configs:
    - webhook_url: https://discord.com/api/webhooks/x
    email_configs:
    - auth_password: PW
      auth_username: x
      from: x@b.c
      require_tls: true
      smarthost: smtp:587
      to: a@b.c
    name: monitoring/chat
    slack_configs:
    - api_url: https://hooks.slack.com/x
      channel: '#alerts'
      text: x
      title: t
    telegram_configs:
    - bot_token: TG
      chat_id: 42
      parse_mode: HTML
  - name: monitoring/keep
    webhook_configs:
    - http_config:
        authorization:
          credentials: K
      max_alerts: 0
      url: http://keep-backend.keep:8080/alerts/event/prometheus
  - name: monitoring/pushover
    pushover_configs:
    - priority: "1"
      send_resolved: true
      token: T
      user_key: U
  - name: team-b/other
    webhook_configs:
    - url: http://hook
  route:
    group_by:
    - alertname
    - namespace
    group_interval: 5m
    group_wait: 30s
    receiver: monitoring/keep
    repeat_interval: 4h
    routes:
    - continue: true
      matchers:
      - severity="critical"
      receiver: monitoring/pushover
  templates:
  - default.tmpl
template_files:
  default.tmpl: '{{ define "pushover.default.title" }}[{{ .Status }}] {{ .CommonLabels.alertname
    }}{{ end }}'
