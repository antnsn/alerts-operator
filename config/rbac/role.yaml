---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - observability.antnsn.dev
  resources:
  - alertrulegroups
  - contactpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - observability.antnsn.dev
  resources:
  - alertrulegroups/status
  - contactpoints/status
  - notificationpolicies/status
  - tenants/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - observability.antnsn.dev
  resources:
  - notificationpolicies
  - tenants
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - observability.antnsn.dev
  resources:
  - notificationpolicies/finalizers
  - tenants/finalizers
  verbs:
  - update
